<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Image Tracer — Visual Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      color: #172033;
      background: #f4f6fb;
      font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 { margin: 0 0 20px; font-size: 26px; }
    main { display: flex; gap: 24px; align-items: flex-start; }
    section { min-width: 0; }
    h2 { margin: 0 0 10px; font-size: 17px; }
    canvas {
      display: block;
      width: 320px;
      height: 320px;
      border: 1px solid #aeb8ca;
      border-radius: 6px;
      background: #fff;
      image-rendering: auto;
    }
    button {
      margin-top: 20px;
      padding: 10px 18px;
      border: 0;
      border-radius: 5px;
      color: #fff;
      background: #2457d6;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: .65; }
    #log {
      width: 100%;
      min-height: 120px;
      margin: 24px 0 0;
      padding: 14px;
      overflow: auto;
      border: 1px solid #ccd4e2;
      border-radius: 6px;
      color: #e8edf8;
      background: #172033;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Image Tracer — Visual Test</h1>
  <main>
    <section>
      <h2>Original</h2>
      <canvas id="originalCanvas" width="320" height="320" aria-label="Original image"></canvas>
    </section>
    <section>
      <h2>Traced</h2>
      <canvas id="tracedCanvas" width="320" height="320" aria-label="Traced image"></canvas>
    </section>
  </main>
  <button id="runTest" type="button">Run Test</button>
  <pre id="log" aria-live="polite"></pre>
  <script>
    const originalCanvas = document.getElementById('originalCanvas');
    const tracedCanvas = document.getElementById('tracedCanvas');
    const runTestButton = document.getElementById('runTest');
    const logElement = document.getElementById('log');

    function log(message) {
      logElement.textContent += `${message}\n`;
      logElement.scrollTop = logElement.scrollHeight;
    }

    function drawContained(context, image, width, height) {
      const scale = Math.min(width / image.width, height / image.height);
      const drawnWidth = image.width * scale;
      const drawnHeight = image.height * scale;
      context.clearRect(0, 0, width, height);
      context.drawImage(image, (width - drawnWidth) / 2, (height - drawnHeight) / 2, drawnWidth, drawnHeight);
    }

    async function loadOriginal() {
      const response = await fetch('/test-images/test1.png');
      if (!response.ok) throw new Error(`Could not load test image: HTTP ${response.status}`);
      const blob = await response.blob();
      const image = await createImageBitmap(blob);
      drawContained(originalCanvas.getContext('2d'), image, originalCanvas.width, originalCanvas.height);
      return image;
    }

    async function drawSvg(svg) {
      const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
      try {
        const image = await new Promise((resolve, reject) => {
          const value = new Image();
          value.onload = () => resolve(value);
          value.onerror = () => reject(new Error('Could not render traced SVG'));
          value.src = url;
        });
        drawContained(tracedCanvas.getContext('2d'), image, tracedCanvas.width, tracedCanvas.height);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    async function runBrowserTest(options) {
      runTestButton.disabled = true;
      logElement.textContent = '';
      log('stdout: browser visual test started');
      try {
        await loadOriginal();
        const response = await fetch('/api/trace', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ imagePath: 'test1.png', options })
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || `Trace failed: HTTP ${response.status}`);
        await drawSvg(payload.svg);
        log('stdout: original and traced image rendered');
        log('stdout: browser visual test passed');
        window.visualTestResult = { ok: true, svg: payload.svg };
        return payload.svg;
      } catch (error) {
        log(`stderr: ${error.stack || error.message}`);
        window.visualTestResult = { ok: false, error: error.message };
        throw error;
      } finally {
        runTestButton.disabled = false;
      }
    }

    runTestButton.addEventListener('click', async () => {
      try {
        await runBrowserTest({ threshold: 128, minArea: 4 });
      } catch (error) {
        log(`stderr: ${error.message}`);
      }
    });

    window.runBrowserTest = runBrowserTest;
    loadOriginal().catch((error) => log(`stderr: ${error.message}`));
  </script>
</body>
</html>
